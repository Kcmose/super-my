name: Verify published management v1.2.0

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-published-management-v1.2.0
  cancel-in-progress: false

jobs:
  verify_published_management:
    name: Verify immutable management v1.2.0 assets
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.tag_name == 'v1.2.0')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: v1.2.0
      EXPECTED_SOURCE_COMMIT: c742b071a1b082c2980b0f1fcd17fc80e9de84b3
      EXPECTED_TAG_OBJECT: 4c7166831c44113cb4edcce7e586de8526dc8b2d
      EXPECTED_INSTALLER_SIZE: '162840'
      EXPECTED_INSTALLER_SHA256: 9a3f460da73559cf90574bbdcc0dfdd1057dfaa8e2eafe7a2fa22ece8d85ab3c
      EXPECTED_SHA256SUMS_SIZE: '230'
      EXPECTED_SHA256SUMS_SHA256: 3369eb411e748a66f762a24849caae99a37de6b35cfea7d8f967a44a58d1c874
      EXPECTED_AMD64_SIZE: '7829818'
      EXPECTED_AMD64_SHA256: 3c0638437e2bfa0a80742625c63e26a56e1699bb708dc55d7c5a199d1698b53d
      EXPECTED_ARM64_SIZE: '7173356'
      EXPECTED_ARM64_SHA256: a3e3ba684113385ae2161e1313aee8928123fdc0ab3a3175e669aea50ae2c65d
      EXPECTED_VERIFIER_COMMIT: ${{ github.workflow_sha }}
      REVIEWED_SOURCE_ROOT: ${{ github.workspace }}/reviewed-source
      VERIFIER_SOURCE_ROOT: ${{ github.workspace }}/release-verifier
    steps:
      - name: Check out the exact verifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: release-verifier
          sparse-checkout: .github/scripts/verify-published-management-v1.2.0.py
          sparse-checkout-cone-mode: false

      - name: Check out the exact published source tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: c742b071a1b082c2980b0f1fcd17fc80e9de84b3
          path: reviewed-source

      - name: Set up fixed Go verifier toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.12'
          cache: false
          check-latest: false

      - name: Require the exact annotated source tag
        shell: bash
        env:
          BASH_ENV: /dev/null
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == Kcmose/super-my ]]
          [[ "$GITHUB_WORKSPACE" == "$PWD" ]]
          [[ "$REVIEWED_SOURCE_ROOT" == "$GITHUB_WORKSPACE/reviewed-source" ]]
          [[ "$VERIFIER_SOURCE_ROOT" == "$GITHUB_WORKSPACE/release-verifier" ]]
          [[ -d "$REVIEWED_SOURCE_ROOT/.git" && ! -L "$REVIEWED_SOURCE_ROOT/.git" ]]
          [[ -d "$VERIFIER_SOURCE_ROOT/.git" && ! -L "$VERIFIER_SOURCE_ROOT/.git" ]]

          trusted_git() (
            unset GH_TOKEN GITHUB_TOKEN
            unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE
            unset GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
            unset GIT_REPLACE_REF_BASE GIT_NAMESPACE GIT_EXEC_PATH
            unset GIT_CONFIG GIT_CONFIG_SYSTEM GIT_CONFIG_GLOBAL
            unset GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
            unset GIT_ATTR_NOSYSTEM GIT_ASKPASS SSH_ASKPASS
            export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
            export GIT_ATTR_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
            export GIT_TERMINAL_PROMPT=0
            command /usr/bin/git --no-replace-objects \
              -c credential.helper= \
              -c http.extraHeader= \
              -c "safe.directory=$REVIEWED_SOURCE_ROOT" \
              -c "safe.directory=$VERIFIER_SOURCE_ROOT" "$@"
          )

          [[ -z "$(trusted_git -c core.fsmonitor=false -c core.untrackedCache=false \
            -C "$REVIEWED_SOURCE_ROOT" status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(trusted_git -c core.fsmonitor=false -c core.untrackedCache=false \
            -C "$VERIFIER_SOURCE_ROOT" status --porcelain=v1 --untracked-files=all)" ]]
          [[ "$(trusted_git -C "$VERIFIER_SOURCE_ROOT" rev-parse --verify 'HEAD^{commit}')" == \
            "$EXPECTED_VERIFIER_COMMIT" ]]
          local_tag_object="$(trusted_git -C "$REVIEWED_SOURCE_ROOT" \
            rev-parse --verify "refs/tags/$RELEASE_TAG")"
          local_tag_commit="$(trusted_git -C "$REVIEWED_SOURCE_ROOT" \
            rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$local_tag_object" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$local_tag_commit" == "$EXPECTED_SOURCE_COMMIT" ]]
          [[ "$(trusted_git -C "$REVIEWED_SOURCE_ROOT" rev-parse --verify 'HEAD^{commit}')" == \
            "$EXPECTED_SOURCE_COMMIT" ]]
          [[ "$(trusted_git -C "$REVIEWED_SOURCE_ROOT" cat-file -t \
            "$EXPECTED_TAG_OBJECT")" == tag ]]

          remote_tags="$(trusted_git -C / ls-remote --exit-code \
            https://github.com/Kcmose/super-my.git \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          [[ "$(awk -v ref="refs/tags/$RELEASE_TAG" \
            '$2 == ref { count++ } END { print count + 0 }' <<<"$remote_tags")" -eq 1 ]]
          [[ "$(awk -v ref="refs/tags/$RELEASE_TAG^{}" \
            '$2 == ref { count++ } END { print count + 0 }' <<<"$remote_tags")" -eq 1 ]]
          [[ "$(awk -v ref="refs/tags/$RELEASE_TAG" \
            '$2 == ref { print $1 }' <<<"$remote_tags")" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(awk -v ref="refs/tags/$RELEASE_TAG^{}" \
            '$2 == ref { print $1 }' <<<"$remote_tags")" == "$EXPECTED_SOURCE_COMMIT" ]]

      - name: Download and bind the anonymous public release
        shell: bash
        env:
          BASH_ENV: /dev/null
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          asset_root="$RUNNER_TEMP/probe-panel-published-v1.2.0"
          metadata_verifier="$RUNNER_TEMP/verify-release-metadata-v1.2.0.py"
          [[ ! -e "$asset_root" && ! -L "$asset_root" ]]
          install -d -m 0700 "$asset_root"
          printf 'ASSET_ROOT=%s\n' "$asset_root" >> "$GITHUB_ENV"
          printf 'METADATA_VERIFIER=%s\n' "$metadata_verifier" >> "$GITHUB_ENV"

          public_api() (
            unset GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS
            command /usr/bin/curl -q --disable --fail --location \
              --show-error --silent --compressed \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 120 \
              --retry 4 --retry-all-errors --retry-delay 2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --header 'User-Agent: probe-panel-public-release-verifier' "$@"
          )
          public_download() (
            unset GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS
            command /usr/bin/curl -q --disable --fail --location \
              --show-error --silent \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 600 \
              --retry 4 --retry-all-errors --retry-delay 2 "$@"
          )

          cat > "$metadata_verifier" <<'PY'
          import json
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1])
          normalized_path = pathlib.Path(sys.argv[2])
          expected_commit = sys.argv[3]
          release = json.loads(source.read_text(encoding="utf-8"))
          expected = {
              "SHA256SUMS": (230, "3369eb411e748a66f762a24849caae99a37de6b35cfea7d8f967a44a58d1c874"),
              "probe-panel-management-v1.2.0-linux-amd64.tar.gz": (7829818, "3c0638437e2bfa0a80742625c63e26a56e1699bb708dc55d7c5a199d1698b53d"),
              "probe-panel-management-v1.2.0-linux-arm64.tar.gz": (7173356, "a3e3ba684113385ae2161e1313aee8928123fdc0ab3a3175e669aea50ae2c65d"),
          }
          if release.get("tag_name") != "v1.2.0":
              raise SystemExit("release tag mismatch")
          if release.get("name") != "v1.2.0":
              raise SystemExit("release name mismatch")
          if release.get("target_commitish") != expected_commit:
              raise SystemExit("release target commit mismatch")
          if release.get("draft") is not False or release.get("prerelease") is not False:
              raise SystemExit("release is not stable and published")
          if release.get("immutable") is not True:
              raise SystemExit("release is not immutable")
          if not isinstance(release.get("published_at"), str) or not release["published_at"].endswith("Z"):
              raise SystemExit("release has no canonical publication time")
          if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", release["published_at"]) is None:
              raise SystemExit("release publication time is not canonical UTC")
          if release.get("url") != "https://api.github.com/repos/Kcmose/super-my/releases/" + str(release.get("id")):
              raise SystemExit("release API URL mismatch")
          if release.get("html_url") != "https://github.com/Kcmose/super-my/releases/tag/v1.2.0":
              raise SystemExit("release URL mismatch")
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != 3:
              raise SystemExit("release must contain exactly three assets")
          by_name = {}
          normalized_assets = []
          for asset in assets:
              name = asset.get("name")
              if name in by_name or name not in expected:
                  raise SystemExit("unexpected or duplicate release asset")
              size, digest = expected[name]
              expected_url = f"https://github.com/Kcmose/super-my/releases/download/v1.2.0/{name}"
              if asset.get("state") != "uploaded":
                  raise SystemExit(f"{name}: asset is not uploaded")
              if asset.get("size") != size:
                  raise SystemExit(f"{name}: asset size mismatch")
              if asset.get("digest") != f"sha256:{digest}":
                  raise SystemExit(f"{name}: asset digest mismatch")
              if asset.get("browser_download_url") != expected_url:
                  raise SystemExit(f"{name}: download URL mismatch")
              if not isinstance(asset.get("id"), int) or asset["id"] <= 0:
                  raise SystemExit(f"{name}: invalid asset ID")
              by_name[name] = asset
              normalized_assets.append({
                  "id": asset["id"],
                  "name": name,
                  "state": asset["state"],
                  "size": asset["size"],
                  "digest": asset["digest"],
                  "browser_download_url": asset["browser_download_url"],
                  "created_at": asset.get("created_at"),
                  "updated_at": asset.get("updated_at"),
              })
          if set(by_name) != set(expected):
              raise SystemExit("release asset set mismatch")
          if not isinstance(release.get("id"), int) or release["id"] <= 0:
              raise SystemExit("invalid release ID")
          normalized = {
              "id": release["id"],
              "node_id": release.get("node_id"),
              "url": release["url"],
              "tag_name": release["tag_name"],
              "target_commitish": release["target_commitish"],
              "name": release["name"],
              "draft": release["draft"],
              "prerelease": release["prerelease"],
              "immutable": release["immutable"],
              "created_at": release.get("created_at"),
              "published_at": release["published_at"],
              "html_url": release["html_url"],
              "assets": sorted(normalized_assets, key=lambda item: item["name"]),
          }
          normalized_path.write_text(
              json.dumps(normalized, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          chmod 0600 "$metadata_verifier"

          public_api \
            "https://api.github.com/repos/Kcmose/super-my/releases/tags/$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-initial-v1.2.0.json"
          python3 "$metadata_verifier" \
            "$RUNNER_TEMP/release-initial-v1.2.0.json" \
            "$RUNNER_TEMP/release-initial-v1.2.0.normalized.json" \
            "$EXPECTED_SOURCE_COMMIT"

          for asset in \
            SHA256SUMS \
            probe-panel-management-v1.2.0-linux-amd64.tar.gz \
            probe-panel-management-v1.2.0-linux-arm64.tar.gz; do
            public_download \
              "https://github.com/Kcmose/super-my/releases/download/$RELEASE_TAG/$asset" \
              --output "$asset_root/$asset"
          done
          public_download \
            "https://raw.githubusercontent.com/Kcmose/super-my/$RELEASE_TAG/install.sh" \
            --output "$RUNNER_TEMP/install-v1.2.0.raw.sh"

      - name: Verify checksums, canonical bundles, and management-only scope
        shell: bash
        env:
          BASH_ENV: /dev/null
          GOENV: 'off'
          GOWORK: 'off'
          GOFLAGS: '-mod=readonly'
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          [[ "$ASSET_ROOT" == "$RUNNER_TEMP/probe-panel-published-v1.2.0" ]]
          [[ -d "$ASSET_ROOT" && ! -L "$ASSET_ROOT" ]]
          expected_names="$(printf '%s\n' \
            SHA256SUMS \
            probe-panel-management-v1.2.0-linux-amd64.tar.gz \
            probe-panel-management-v1.2.0-linux-arm64.tar.gz | sort)"
          actual_names="$(find "$ASSET_ROOT" -mindepth 1 -maxdepth 1 \
            -type f -printf '%f\n' | sort)"
          [[ "$actual_names" == "$expected_names" ]]
          [[ "$(find "$ASSET_ROOT" -mindepth 1 -maxdepth 1 | wc -l)" -eq 3 ]]
          [[ -z "$(find "$ASSET_ROOT" -mindepth 1 -maxdepth 1 \
            ! -type f -print -quit)" ]]

          [[ "$(stat -c '%s' "$ASSET_ROOT/SHA256SUMS")" == \
            "$EXPECTED_SHA256SUMS_SIZE" ]]
          [[ "$(sha256sum "$ASSET_ROOT/SHA256SUMS" | awk '{print $1}')" == \
            "$EXPECTED_SHA256SUMS_SHA256" ]]
          [[ "$(stat -c '%s' \
            "$ASSET_ROOT/probe-panel-management-v1.2.0-linux-amd64.tar.gz")" == \
            "$EXPECTED_AMD64_SIZE" ]]
          [[ "$(sha256sum \
            "$ASSET_ROOT/probe-panel-management-v1.2.0-linux-amd64.tar.gz" | \
            awk '{print $1}')" == "$EXPECTED_AMD64_SHA256" ]]
          [[ "$(stat -c '%s' \
            "$ASSET_ROOT/probe-panel-management-v1.2.0-linux-arm64.tar.gz")" == \
            "$EXPECTED_ARM64_SIZE" ]]
          [[ "$(sha256sum \
            "$ASSET_ROOT/probe-panel-management-v1.2.0-linux-arm64.tar.gz" | \
            awk '{print $1}')" == "$EXPECTED_ARM64_SHA256" ]]

          [[ "$(wc -l < "$ASSET_ROOT/SHA256SUMS")" -eq 2 ]]
          expected_checksum_names="$(printf '%s\n' \
            probe-panel-management-v1.2.0-linux-amd64.tar.gz \
            probe-panel-management-v1.2.0-linux-arm64.tar.gz | sort)"
          actual_checksum_names="$(awk '
            $1 !~ /^[0-9a-f]{64}$/ { exit 2 }
            NF != 2 { exit 3 }
            { print $2 }
          ' "$ASSET_ROOT/SHA256SUMS" | sort)"
          [[ "$actual_checksum_names" == "$expected_checksum_names" ]]
          (
            cd "$ASSET_ROOT"
            sha256sum --check --strict SHA256SUMS
          )

          [[ -f "$RUNNER_TEMP/install-v1.2.0.raw.sh" && \
            ! -L "$RUNNER_TEMP/install-v1.2.0.raw.sh" ]]
          [[ "$(stat -c '%s' "$RUNNER_TEMP/install-v1.2.0.raw.sh")" == \
            "$EXPECTED_INSTALLER_SIZE" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/install-v1.2.0.raw.sh" | awk '{print $1}')" == \
            "$EXPECTED_INSTALLER_SHA256" ]]
          cmp -- "$RUNNER_TEMP/install-v1.2.0.raw.sh" "$REVIEWED_SOURCE_ROOT/install.sh"

          python3 \
            "$VERIFIER_SOURCE_ROOT/.github/scripts/verify-published-management-v1.2.0.py" \
            "$ASSET_ROOT" \
            "$EXPECTED_SOURCE_COMMIT" \
            "$EXPECTED_TAG_OBJECT"

          [[ "$(go env GOVERSION)" == go1.23.12 ]]
          gate_summary="$RUNNER_TEMP/probe-support-gate-v1.2.0.json"
          (
            cd "$REVIEWED_SOURCE_ROOT/probe-api"
            env GOTOOLCHAIN=local go run ./cmd/probe-support-gate verify \
              --support-root deploy/support \
              --release "$RELEASE_TAG" \
              --require-zero-supported \
              --release-assets "$ASSET_ROOT" \
              --source-commit "$EXPECTED_SOURCE_COMMIT" \
              --source-tag-object "$EXPECTED_TAG_OBJECT"
          ) > "$gate_summary"
          jq -e '
            .release == "v1.2.0"
            and .cells == 60
            and .candidate == 60
            and .supported == 0
            and .supported_platforms == 0
            and (.platforms | length == 15)
            and all(.platforms[];
              .candidate == 4
              and .supported == 0
              and .formal_supported == false
            )
          ' "$gate_summary" >/dev/null

      - name: Recheck immutable public metadata and source references
        shell: bash
        env:
          BASH_ENV: /dev/null
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          public_api() (
            unset GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS
            command /usr/bin/curl -q --disable --fail --location \
              --show-error --silent --compressed \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 120 \
              --retry 4 --retry-all-errors --retry-delay 2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --header 'User-Agent: probe-panel-public-release-verifier' "$@"
          )
          public_download() (
            unset GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS
            command /usr/bin/curl -q --disable --fail --location \
              --show-error --silent \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 120 \
              --retry 4 --retry-all-errors --retry-delay 2 "$@"
          )
          trusted_git() (
            unset GH_TOKEN GITHUB_TOKEN
            unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE
            unset GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
            unset GIT_REPLACE_REF_BASE GIT_NAMESPACE GIT_EXEC_PATH
            unset GIT_CONFIG GIT_CONFIG_SYSTEM GIT_CONFIG_GLOBAL
            unset GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS
            unset GIT_ATTR_NOSYSTEM GIT_ASKPASS SSH_ASKPASS
            export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
            export GIT_ATTR_NOSYSTEM=1 GIT_NO_REPLACE_OBJECTS=1
            export GIT_TERMINAL_PROMPT=0
            command /usr/bin/git --no-replace-objects \
              -c credential.helper= \
              -c http.extraHeader= \
              -c "safe.directory=$REVIEWED_SOURCE_ROOT" \
              -c "safe.directory=$VERIFIER_SOURCE_ROOT" "$@"
          )

          public_api \
            "https://api.github.com/repos/Kcmose/super-my/releases/tags/$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-final-v1.2.0.json"
          python3 "$METADATA_VERIFIER" \
            "$RUNNER_TEMP/release-final-v1.2.0.json" \
            "$RUNNER_TEMP/release-final-v1.2.0.normalized.json" \
            "$EXPECTED_SOURCE_COMMIT"
          cmp -- \
            "$RUNNER_TEMP/release-initial-v1.2.0.normalized.json" \
            "$RUNNER_TEMP/release-final-v1.2.0.normalized.json"

          public_download \
            "https://github.com/Kcmose/super-my/releases/download/$RELEASE_TAG/SHA256SUMS" \
            --output "$RUNNER_TEMP/SHA256SUMS.recheck"
          cmp -- "$ASSET_ROOT/SHA256SUMS" "$RUNNER_TEMP/SHA256SUMS.recheck"
          public_download \
            "https://raw.githubusercontent.com/Kcmose/super-my/$RELEASE_TAG/install.sh" \
            --output "$RUNNER_TEMP/install-v1.2.0.recheck.sh"
          cmp -- "$RUNNER_TEMP/install-v1.2.0.raw.sh" \
            "$RUNNER_TEMP/install-v1.2.0.recheck.sh"

          remote_tags="$(trusted_git -C / ls-remote --exit-code \
            https://github.com/Kcmose/super-my.git \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          [[ "$(awk -v ref="refs/tags/$RELEASE_TAG" \
            '$2 == ref { count++ } END { print count + 0 }' <<<"$remote_tags")" -eq 1 ]]
          [[ "$(awk -v ref="refs/tags/$RELEASE_TAG^{}" \
            '$2 == ref { count++ } END { print count + 0 }' <<<"$remote_tags")" -eq 1 ]]
          [[ "$(awk -v ref="refs/tags/$RELEASE_TAG" \
            '$2 == ref { print $1 }' <<<"$remote_tags")" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(awk -v ref="refs/tags/$RELEASE_TAG^{}" \
            '$2 == ref { print $1 }' <<<"$remote_tags")" == "$EXPECTED_SOURCE_COMMIT" ]]
          [[ -z "$(trusted_git -c core.fsmonitor=false -c core.untrackedCache=false \
            -C "$REVIEWED_SOURCE_ROOT" status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(trusted_git -c core.fsmonitor=false -c core.untrackedCache=false \
            -C "$VERIFIER_SOURCE_ROOT" status --porcelain=v1 --untracked-files=all)" ]]
