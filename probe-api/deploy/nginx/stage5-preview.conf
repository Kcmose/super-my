# Debian 13 Stage 5 split-panel preview. This is intentionally separate from
# the production host/certificate template in nginx.conf.
worker_processes 1;
pid /srv/probe-stage5-preview/nginx/nginx.pid;
error_log /srv/probe-stage5-preview/nginx/error.log info;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /srv/probe-stage5-preview/nginx/access.log combined;
    client_body_temp_path /srv/probe-stage5-preview/nginx/client-body;
    proxy_temp_path /srv/probe-stage5-preview/nginx/proxy;
    fastcgi_temp_path /srv/probe-stage5-preview/nginx/fastcgi;
    uwsgi_temp_path /srv/probe-stage5-preview/nginx/uwsgi;
    scgi_temp_path /srv/probe-stage5-preview/nginx/scgi;

    geo $stage5_browser_allowed {
        default 0;
        include /srv/probe-stage5-preview/config/admin-allowlist.geo;
    }

    limit_req_zone $binary_remote_addr zone=stage5_admin_login:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=stage5_agent_enroll:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=stage5_agent_runtime:1m rate=30r/s;

    upstream stage5_probe_api {
        server 127.0.0.1:18090;
        keepalive 16;
    }

    server {
        listen 192.168.33.253:18453 ssl;
        server_name 192.168.33.253;
        ssl_certificate /srv/probe-stage5-preview/tls/server.crt;
        ssl_certificate_key /srv/probe-stage5-preview/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 64k;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;

        if ($host != 192.168.33.253) {
            return 444;
        }

        if ($stage5_browser_allowed = 0) {
            return 403;
        }

        location ~ ^/api/v1/panel(?:/|$) {
            proxy_pass http://stage5_probe_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Probe-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Client-IP "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location = /api { return 404; }
        location /api/ { return 404; }
        location = /internal { return 404; }
        location /internal/ { return 404; }
        location = /login { return 404; }
        location ^~ /login/ { return 404; }
        location = /admin { return 404; }
        location ^~ /admin/ { return 404; }
        location = /downloads { return 404; }
        location ^~ /downloads/ { return 404; }
        location ~ (^|/)\. { return 404; }

        location / {
            root /srv/probe-stage5-preview/web;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 192.168.33.253:18455 ssl;
        server_name 192.168.33.253;
        ssl_certificate /srv/probe-stage5-preview/tls/server.crt;
        ssl_certificate_key /srv/probe-stage5-preview/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 64k;
        limit_req_status 429;
        error_page 429 = @stage5_admin_rate_limited;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;

        if ($host != 192.168.33.253) {
            return 444;
        }

        if ($stage5_browser_allowed = 0) {
            return 403;
        }

        location = /api/v1/auth/login {
            limit_req zone=stage5_admin_login burst=10 nodelay;
            proxy_pass http://stage5_probe_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Probe-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Client-IP "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ ^/api/v1/(?:auth|admin)(?:/|$) {
            proxy_pass http://stage5_probe_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Probe-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Client-IP "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ ^/api/v1/panel(?:/|$) {
            proxy_pass http://stage5_probe_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Probe-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Client-IP "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location = /api { return 404; }
        location /api/ { return 404; }
        location = /internal { return 404; }
        location /internal/ { return 404; }
        location = /overview { return 404; }
        location ^~ /overview/ { return 404; }
        location = /nodes { return 404; }
        location ^~ /nodes/ { return 404; }
        location = /probes { return 404; }
        location ^~ /probes/ { return 404; }
        location ~ (^|/)\. { return 404; }

        location @stage5_admin_rate_limited {
            default_type application/json;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
            add_header Retry-After 60 always;
            return 429 '{"error":"rate_limited","message":"too many requests; try again later","request_id":"$request_id"}';
        }

        location = /downloads { return 404; }
        location ^~ /downloads/ { return 404; }

        location / {
            root /srv/probe-stage5-preview/admin;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 192.168.33.253:18454 ssl;
        server_name 192.168.33.253;
        ssl_certificate /srv/probe-stage5-preview/tls/server.crt;
        ssl_certificate_key /srv/probe-stage5-preview/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 256k;
        limit_req_status 429;
        error_page 429 = @stage5_agent_rate_limited;

        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;

        if ($host != 192.168.33.253) {
            return 444;
        }

        location = /api/v1/agent/enroll {
            limit_req zone=stage5_agent_enroll burst=10 nodelay;
            proxy_pass http://stage5_probe_api;
            proxy_set_header Host $host;
            proxy_set_header X-Probe-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
        }

        location = /api/v1/agent/config {
            limit_req zone=stage5_agent_runtime burst=60 nodelay;
            proxy_pass http://stage5_probe_api;
            proxy_set_header Host $host;
            proxy_set_header X-Probe-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
        }

        location = /api/v1/agent/report {
            limit_req zone=stage5_agent_runtime burst=60 nodelay;
            proxy_pass http://stage5_probe_api;
            proxy_set_header Host $host;
            proxy_set_header X-Probe-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
        }

        location ~ ^/downloads/probe-agent/(?:install[.]sh|SHA256SUMS|probe-agent[.]service|linux-(?:amd64|arm64)/probe-agent)$ {
            root /srv/probe-stage5-preview/agent;
            limit_except GET { deny all; }
        }

        location @stage5_agent_rate_limited {
            default_type application/json;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
            add_header Retry-After 60 always;
            return 429 '{"error":"rate_limited","message":"too many requests; try again later","request_id":"$request_id"}';
        }

        location / { return 404; }
    }
}
