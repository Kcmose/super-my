# Probe Panel private-CA IP ingress template. The setup finalizer replaces every
# literal PROBE_SETUP_SERVER_IP with one canonical IPv4 address or one bracketed
# IPv6 address. This file is an included http{} fragment; it deliberately has no
# listener on TCP 80 or 443 and must never be passed through envsubst.

geo $probe_admin_allowed {
    default 0;
    include /etc/probe-panel/admin-allowlist.geo;
}

# Limits are keyed only by the direct socket peer. Never key these zones with a
# forwarding header, Authorization value, token, or cookie.
limit_req_zone $binary_remote_addr zone=probe_agent_enroll_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=probe_agent_runtime_per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=probe_admin_login_per_ip:10m rate=5r/m;

upstream probe_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Visitor panel: https://PROBE_SETUP_SERVER_IP:18453
server {
    listen 18453 ssl default_server;
    listen [::]:18453 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/probe-panel/tls/panel/fullchain.pem;
    ssl_certificate_key /etc/probe-panel/tls/panel/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    # A host-only administrator cookie is port-agnostic. Clear it before any
    # visitor request reaches probe-api and never reflect an API Set-Cookie on
    # this surface.
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_set_header X-Probe-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    if ($http_host != "PROBE_SETUP_SERVER_IP:18453") {
        return 444;
    }
    if ($probe_admin_allowed = 0) {
        return 403;
    }

    location ~ ^/api/v1/panel(?:/|$) {
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location = /api {
        return 404;
    }
    location /api/ {
        return 404;
    }
    location = /internal {
        return 404;
    }
    location /internal/ {
        return 404;
    }
    location ~ (^|/)\. {
        return 404;
    }
    location = /install {
        return 404;
    }
    location ^~ /install/ {
        return 404;
    }
    location = /login {
        return 404;
    }
    location ^~ /login/ {
        return 404;
    }
    location = /admin {
        return 404;
    }
    location ^~ /admin/ {
        return 404;
    }
    location = /downloads {
        return 404;
    }
    location ^~ /downloads/ {
        return 404;
    }

    location / {
        root /srv/probe/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# Administrator panel: https://PROBE_SETUP_SERVER_IP:18455
server {
    listen 18455 ssl default_server;
    listen [::]:18455 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/probe-panel/tls/admin/fullchain.pem;
    ssl_certificate_key /etc/probe-panel/tls/admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    proxy_set_header Host $http_host;
    proxy_set_header X-Probe-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @probe_admin_rate_limited;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    if ($http_host != "PROBE_SETUP_SERVER_IP:18455") {
        return 444;
    }
    if ($probe_admin_allowed = 0) {
        return 403;
    }

    location = /api/v1/auth/login {
        limit_req zone=probe_admin_login_per_ip burst=10 nodelay;
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location ~ ^/api/v1/(?:auth|admin)(?:/|$) {
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location ~ ^/api/v1/panel(?:/|$) {
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location = /api {
        return 404;
    }
    location /api/ {
        return 404;
    }
    location = /internal {
        return 404;
    }
    location /internal/ {
        return 404;
    }

    location @probe_admin_rate_limited {
        default_type application/json;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate_limited","message":"too many requests; try again later","request_id":"$request_id"}';
    }

    location ~ (^|/)\. {
        return 404;
    }
    location = /install {
        return 404;
    }
    location ^~ /install/ {
        return 404;
    }
    location = /overview {
        return 404;
    }
    location ^~ /overview/ {
        return 404;
    }
    location = /probes {
        return 404;
    }
    location ^~ /probes/ {
        return 404;
    }
    location = /nodes {
        return 404;
    }
    location ^~ /nodes/ {
        return 404;
    }
    location = /downloads {
        return 404;
    }
    location ^~ /downloads/ {
        return 404;
    }

    location / {
        root /srv/probe/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# Agent API and bootstrap downloads: https://PROBE_SETUP_SERVER_IP:18454
server {
    listen 18454 ssl default_server;
    listen [::]:18454 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/probe-panel/tls/api/fullchain.pem;
    ssl_certificate_key /etc/probe-panel/tls/api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;

    # Browsers send host-only cookies to every port on an IP. Agent requests
    # authenticate only with Agent credentials, so administrator cookies are
    # stripped in both directions here as well.
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_set_header X-Probe-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @probe_agent_rate_limited;

    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    if ($http_host != "PROBE_SETUP_SERVER_IP:18454") {
        return 444;
    }

    location = /api/v1/agent/enroll {
        limit_req zone=probe_agent_enroll_per_ip burst=10 nodelay;
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location = /api/v1/agent/config {
        limit_req zone=probe_agent_runtime_per_ip burst=60 nodelay;
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location = /api/v1/agent/report {
        limit_req zone=probe_agent_runtime_per_ip burst=60 nodelay;
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    # The private CA is public verification material, but this exact route is
    # the only place that may expose it. Private keys remain outside all roots.
    location = /downloads/probe-agent/ca.pem {
        alias /etc/probe-panel/tls/private-ca/ca.pem;
        default_type application/x-pem-file;
        limit_except GET {
            deny all;
        }
    }

    location ~ ^/downloads/probe-agent/(?:install[.]sh|SHA256SUMS|probe-agent[.]service|linux-(?:amd64|arm64)/probe-agent)$ {
        root /srv/probe/agent;
        limit_except GET {
            deny all;
        }
    }

    location /api/v1/agent/ {
        return 404;
    }

    location @probe_agent_rate_limited {
        default_type application/json;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate_limited","message":"too many requests; try again later","request_id":"$request_id"}';
    }

    location ^~ /api/v1/public/ {
        return 404;
    }
    location / {
        return 404;
    }
}
