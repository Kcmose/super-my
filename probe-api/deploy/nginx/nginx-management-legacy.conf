# Probe management-only domain ingress template. This http{} fragment exposes
# the administrator UI/API and the credential-protected Agent API used after
# the independent Agent product is configured. Visitor assets and Agent
# binaries/download artifacts are intentionally absent.

geo $probe_admin_allowed {
    default 0;
    include /etc/probe-panel/admin-allowlist.geo;
}

limit_req_zone $binary_remote_addr zone=probe_admin_login_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=probe_agent_enroll_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=probe_agent_runtime_per_ip:10m rate=30r/s;

upstream probe_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;
    server_tokens off;
    return 301 https://admin.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;
    server_tokens off;

    ssl_certificate /etc/probe-panel/tls/admin/fullchain.pem;
    ssl_certificate_key /etc/probe-panel/tls/admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Probe-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @probe_admin_rate_limited;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    if ($host != admin.example.com) {
        return 444;
    }
    location = /api/v1/auth/login {
        if ($probe_admin_allowed = 0) {
            return 403;
        }
        limit_req zone=probe_admin_login_per_ip burst=10 nodelay;
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location ~ ^/api/v1/(?:auth|admin)(?:/|$) {
        if ($probe_admin_allowed = 0) {
            return 403;
        }
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    # probe-admin consumes the panel read model for dashboard state even when
    # the independent visitor frontend has not been installed.
    location ~ ^/api/v1/panel(?:/|$) {
        if ($probe_admin_allowed = 0) {
            return 403;
        }
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    # Agent is a separately installed product, but it reports to the API that
    # belongs to this management product. These exact routes intentionally do
    # not use the administrator IP allowlist; Go requires enrollment/Agent
    # credentials and leaves the routes unregistered until Agent integration
    # is explicitly configured.
    location = /api/v1/agent/enroll {
        limit_req zone=probe_agent_enroll_per_ip burst=10 nodelay;
        error_page 429 = @probe_agent_rate_limited;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location = /api/v1/agent/config {
        limit_req zone=probe_agent_runtime_per_ip burst=60 nodelay;
        error_page 429 = @probe_agent_rate_limited;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location = /api/v1/agent/report {
        limit_req zone=probe_agent_runtime_per_ip burst=60 nodelay;
        error_page 429 = @probe_agent_rate_limited;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
    }

    location /api/v1/agent/ {
        return 404;
    }

    location = /api/v1/setup {
        return 404;
    }
    location ^~ /api/v1/setup/ {
        return 404;
    }
    location = /api {
        return 404;
    }
    location /api/ {
        return 404;
    }
    location = /internal {
        return 404;
    }
    location /internal/ {
        return 404;
    }

    location @probe_admin_rate_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate_limited","message":"too many requests; try again later","request_id":"$request_id"}';
    }

    location @probe_agent_rate_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate_limited","message":"too many requests; try again later","request_id":"$request_id"}';
    }

    location ~ (^|/)\. {
        return 404;
    }
    location = /install {
        return 404;
    }
    location ^~ /install/ {
        return 404;
    }
    location = /overview {
        return 404;
    }
    location ^~ /overview/ {
        return 404;
    }
    location = /probes {
        return 404;
    }
    location ^~ /probes/ {
        return 404;
    }
    location = /nodes {
        return 404;
    }
    location ^~ /nodes/ {
        return 404;
    }
    location = /downloads {
        return 404;
    }
    location ^~ /downloads/ {
        return 404;
    }

    location / {
        if ($probe_admin_allowed = 0) {
            return 403;
        }
        root /srv/probe/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
