    CreateProbeTargetRequest:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/ProbeTargetTypeRules'
      required: [node_id, name, type, host, port, path, interval_seconds, timeout_seconds, retention_seconds, enabled]
      properties:
        node_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        name: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string, enum: [tcp, http, https] }
        host: { type: string, minLength: 1, maxLength: 253 }
        port: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
        path: { type: [string, 'null'], maxLength: 2048, pattern: '^/[^?#]*$', description: HTTP(S) null is normalized to `/`; query and fragment characters are rejected; TCP requires null. }
        interval_seconds: { type: integer, minimum: 10, maximum: 86400, default: 30 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 60, default: 3 }
        retention_seconds: { type: integer, minimum: 1, maximum: 7776000 }
        enabled: { type: boolean, default: true }
    UpdateProbeTargetRequest:
      type: object
      additionalProperties: false
      description: Partial fields are merged with the stored target, then the complete result is validated against ProbeTargetTypeRules and timeout <= interval.
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string, enum: [tcp, http, https] }
        host: { type: string, minLength: 1, maxLength: 253 }
        port: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
        path: { type: [string, 'null'], maxLength: 2048, pattern: '^/[^?#]*$', description: HTTP(S) null is normalized to `/`; query and fragment characters are rejected; TCP requires null after merge. }
        interval_seconds: { type: integer, minimum: 10, maximum: 86400 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 60 }
        retention_seconds: { type: integer, minimum: 1, maximum: 7776000 }
        enabled: { type: boolean }
    ProbeSeriesPoint:
      type: object
      additionalProperties: false
      description: >-
        `loss_rate` is transport loss only. `failure_rate` is
        `(sent_count - received_count + http_error_count) / sent_count`.
        HTTP statuses below 200 or at least 400 are application errors. Raw
        points expose the exact HTTP status; 5m and 1h points always return null
        because mixed statuses are not fabricated.
      required:
        - time
        - result_count
        - sent_count
        - received_count
        - http_status_code
        - http_error_count
        - latency_sum_us
        - latency_min_us
        - latency_max_us
        - loss_rate
        - failure_rate
        - average_latency_us
      properties:
        time: { type: string, format: date-time }
        result_count: { type: integer, minimum: 1 }
        sent_count: { type: integer, minimum: 1 }
        received_count: { type: integer, minimum: 0 }
        http_status_code: { type: [integer, 'null'], minimum: 100, maximum: 599, description: Exact status for a raw HTTP(S) point; always null for 5m and 1h points. }
        http_error_count: { type: integer, minimum: 0, description: Received HTTP responses whose status is below 200 or at least 400; never exceeds received_count. }
        latency_sum_us: { type: integer, minimum: 0 }
        latency_min_us: { type: [integer, 'null'], minimum: 0 }
        latency_max_us: { type: [integer, 'null'], minimum: 0 }
        loss_rate: { type: number, minimum: 0, maximum: 1 }
        failure_rate: { type: number, minimum: 0, maximum: 1 }
        average_latency_us: { type: [number, 'null'], minimum: 0 }
    ProbeSeriesResponse:
      type: object
      additionalProperties: false
      required: [target, resolution, from, to, as_of, points]
      properties:
        target: { $ref: '#/components/schemas/ProbeTarget' }
        resolution: { type: string, enum: [raw, 5m, 1h] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        as_of: { type: string, format: date-time }
        points:
          type: array
          maxItems: 2200
          items: { $ref: '#/components/schemas/ProbeSeriesPoint' }
    CreateEnrollmentTokenRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
    EnrollmentTokenResponse:
      type: object
