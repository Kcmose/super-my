      properties:
        audit_id: { type: integer, minimum: 1 }
        actor_user_id: { type: [string, 'null'], format: uuid }
        actor_username: { type: [string, 'null'], maxLength: 128 }
        action: { type: string, minLength: 1, maxLength: 128 }
        target_type: { type: [string, 'null'], maxLength: 128 }
        target_id: { type: [string, 'null'], maxLength: 256 }
        source_ip: { type: [string, 'null'] }
        request_id: { type: string, minLength: 1, maxLength: 128 }
        before_summary: { type: [object, 'null'], additionalProperties: true }
        after_summary: { type: [object, 'null'], additionalProperties: true }
        result: { type: string, enum: [success, failure] }
        error_code: { type: [string, 'null'], maxLength: 128 }
        occurred_at: { type: string, format: date-time }
    AuditLogListResponse:
