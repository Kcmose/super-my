# Probe Panel V1 production ingress template. Install as an included http{}
# fragment. Do not apply it to a development preview or a private-CA IP origin.
#
# /etc/probe-panel/admin-allowlist.geo is the single allowlist source shared by
# Nginx and probe-api. It contains only validated explicit IP/CIDR lines:
#     192.0.2.10/32 1;
# An empty file intentionally denies every management client.
# Before nginx -t and reload, validate this exact file with:
#     /srv/probe/api/probe-api config validate-admin-allowlist /etc/probe-panel/admin-allowlist.geo
# Then restart probe-api so its in-memory second layer reads the same file,
# run nginx -t, and only then reload Nginx. Never reload after either check or
# the API restart fails.

geo $probe_admin_allowed {
    default 0;
    include /etc/probe-panel/admin-allowlist.geo;
}

# Ingress limits are keyed only by the direct socket peer. Do not replace these
# keys with Authorization or any client-supplied forwarding header.
limit_req_zone $binary_remote_addr zone=probe_agent_enroll_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=probe_agent_runtime_per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=probe_admin_login_per_ip:10m rate=5r/m;

upstream probe_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com admin.example.com api.example.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;
    server_tokens off;

    ssl_certificate /etc/probe-panel/tls/panel/fullchain.pem;
    ssl_certificate_key /etc/probe-panel/tls/panel/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    if ($host != panel.example.com) {
        return 444;
    }

    if ($probe_admin_allowed = 0) {
        return 403;
    }

    # The visitor surface exposes only anonymous read-only panel data. The
    # server-level allowlist remains mandatory; auth/admin are never proxied.
    location ~ ^/api/v1/panel(?:/|$) {
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location = /internal {
        return 404;
    }

    location /internal/ {
        return 404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    # Reserved administrator UI routes never enter the visitor SPA fallback.
    location = /login {
        return 404;
    }

    location ^~ /login/ {
        return 404;
    }

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    # Agent bootstrap artifacts exist only on the dedicated Agent host.
    location = /downloads {
        return 404;
    }

    location ^~ /downloads/ {
        return 404;
    }

    # SPA fallback applies only to non-API client routes and can read only the
    # probe-web artifact root. Unknown API paths above fail closed.
    location / {
        root /srv/probe/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.example.com;
    server_tokens off;

    ssl_certificate /etc/probe-panel/tls/admin/fullchain.pem;
    ssl_certificate_key /etc/probe-panel/tls/admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @probe_admin_rate_limited;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    if ($host != admin.example.com) {
        return 444;
    }

    if ($probe_admin_allowed = 0) {
        return 403;
    }

    location = /api/v1/auth/login {
        limit_req zone=probe_admin_login_per_ip burst=10 nodelay;

        proxy_pass http://probe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Authentication and administration exist only on this host. probe-api
    # enforces administrator credentials, Session, role, Origin and CSRF.
    location ~ ^/api/v1/(?:auth|admin)(?:/|$) {
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # The management UI may reuse read-only panel data. These reads remain
    # anonymous at the API contract, but this entire host is allowlisted.
    location ~ ^/api/v1/panel(?:/|$) {
        proxy_pass http://probe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location = /internal {
        return 404;
    }

    location /internal/ {
        return 404;
    }

    location @probe_admin_rate_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate_limited","message":"too many requests; try again later","request_id":"$request_id"}';
    }

    location ~ (^|/)\. {
        return 404;
    }

    # Reserved visitor UI routes never enter the administrator SPA fallback.
    location = /overview {
        return 404;
    }

    location ^~ /overview/ {
        return 404;
    }

    location = /probes {
        return 404;
    }

    location ^~ /probes/ {
        return 404;
    }

    location = /nodes {
        return 404;
    }

    location ^~ /nodes/ {
        return 404;
    }

    # Agent bootstrap artifacts exist only on the dedicated Agent host.
    location = /downloads {
        return 404;
    }

    location ^~ /downloads/ {
        return 404;
    }

    # probe-admin is built and installed independently from probe-web. SPA
    # fallback is limited to non-API client routes; unknown API paths fail closed.
    location / {
        root /srv/probe/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;
    server_tokens off;

    ssl_certificate /etc/probe-panel/tls/api/fullchain.pem;
    ssl_certificate_key /etc/probe-panel/tls/api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    if ($host != api.example.com) {
        return 444;
    }

    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @probe_agent_rate_limited;

    location = /api/v1/agent/enroll {
        limit_req zone=probe_agent_enroll_per_ip burst=10 nodelay;

        proxy_pass http://probe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/v1/agent/config {
        limit_req zone=probe_agent_runtime_per_ip burst=60 nodelay;

        proxy_pass http://probe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/v1/agent/report {
        limit_req zone=probe_agent_runtime_per_ip burst=60 nodelay;

        proxy_pass http://probe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Probe-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Public, non-secret bootstrap assets. The tight allowlist prevents this
    # host from becoming a general-purpose file server; release integrity is
    # checked before /srv/probe/agent is switched atomically.
    location ~ ^/downloads/probe-agent/(?:install[.]sh|SHA256SUMS|probe-agent[.]service|linux-(?:amd64|arm64)/probe-agent)$ {
        root /srv/probe/agent;
        limit_except GET {
            deny all;
        }
    }

    location /api/v1/agent/ {
        return 404;
    }

    location @probe_agent_rate_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate_limited","message":"too many requests; try again later","request_id":"$request_id"}';
    }

    # The optional public API stays dark until a later explicit deployment
    # decision adds only the frozen read-only routes and an API-key policy.
    location ^~ /api/v1/public/ {
        return 404;
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/probe-panel/tls/admin/fullchain.pem;
    ssl_certificate_key /etc/probe-panel/tls/admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}
