        - load_1
        - load_5
        - load_15
        - uptime_seconds
        - memory_total_bytes
        - memory_used_bytes
        - memory_available_bytes
        - swap_total_bytes
        - swap_used_bytes
        - network_rx_bps
        - network_tx_bps
        - network_rx_bytes
        - network_tx_bytes
      properties:
        sampled_at: { type: string, format: date-time }
        cpu_percent: { type: number, minimum: 0, maximum: 100 }
        load_1: { type: number, minimum: 0 }
        load_5: { type: number, minimum: 0 }
        load_15: { type: number, minimum: 0 }
        uptime_seconds: { type: number, minimum: 0 }
        memory_total_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        memory_used_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        memory_available_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        swap_total_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        swap_used_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        network_rx_bps: { type: number, minimum: 0 }
        network_tx_bps: { type: number, minimum: 0 }
        network_rx_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        network_tx_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
    AgentDiskSample:
      type: object
      additionalProperties: false
      required: [sampled_at, mountpoint, total_bytes, used_bytes, available_bytes]
      properties:
        sampled_at: { type: string, format: date-time }
        mountpoint: { type: string, minLength: 1, maxLength: 4096, pattern: '^/' }
        total_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        used_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        available_bytes: { type: integer, minimum: 0, maximum: 9223372036854775807 }
    AgentProbeResult:
      type: object
      additionalProperties: false
      description: Each row is one TCP or HTTP(S) attempt. `sent_count` is exactly 1. A received HTTP(S) response requires its status and a null error code; a transport failure requires a null status and a stable error code. TCP status is always null. HTTP statuses below 200 or at least 400 are application failures, not transport error codes.
      required:
        - target_id
        - sampled_at
        - sent_count
        - received_count
        - latency_sum_us
        - latency_min_us
        - latency_max_us
        - http_status_code
        - error_code
      properties:
        target_id: { type: string, format: uuid }
        sampled_at: { type: string, format: date-time }
        sent_count: { type: integer, const: 1 }
        received_count: { type: integer, minimum: 0, maximum: 1 }
        latency_sum_us: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        latency_min_us: { type: [integer, 'null'], minimum: 0, maximum: 9223372036854775807 }
        latency_max_us: { type: [integer, 'null'], minimum: 0, maximum: 9223372036854775807 }
        http_status_code: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        error_code: { type: [string, 'null'], minLength: 1, maxLength: 128, pattern: '^\S(?:.*\S)?$' }
    AgentReportRequest:
      type: object
      additionalProperties: false
      required: [batch_id, sequence, agent_time, agent_version, config_version, metrics, disks, probe_results]
      properties:
        batch_id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1, maximum: 9223372036854775807, description: Node-scoped strictly increasing sequence; exact retries reuse the same value and body. }
        agent_time: { type: string, format: date-time }
        agent_version: { type: string, minLength: 1, maxLength: 64 }
        config_version: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        metrics:
          type: array
          maxItems: 120
          items: { $ref: '#/components/schemas/AgentMetricSample' }
        disks:
          type: array
          maxItems: 120
          items: { $ref: '#/components/schemas/AgentDiskSample' }
        probe_results:
          type: array
          maxItems: 120
          items: { $ref: '#/components/schemas/AgentProbeResult' }
      anyOf:
        - properties: { metrics: { minItems: 1 } }
        - properties: { disks: { minItems: 1 } }
        - properties: { probe_results: { minItems: 1 } }
    AgentReportResponse:
      type: object
      additionalProperties: false
      description: Duplicate responses reuse the original received_at and clock_status; current_config_version is freshly read so an Agent can notice configuration changes while retrying.
      required: [batch_id, status, received_at, clock_status, current_config_version]
      properties:
        batch_id: { type: string, format: uuid }
        status: { type: string, enum: [accepted, duplicate] }
        received_at: { type: string, format: date-time }
        clock_status: { type: string, enum: [ok, skewed] }
        current_config_version: { type: integer, minimum: 1, maximum: 9223372036854775807 }
    AgentReportAcceptedResponse:
      allOf:
        - $ref: '#/components/schemas/AgentReportResponse'
        - type: object
          properties: { status: { const: accepted } }
    AgentReportDuplicateResponse:
      allOf:
        - $ref: '#/components/schemas/AgentReportResponse'
        - type: object
          properties: { status: { const: duplicate } }
    AuditLog:
