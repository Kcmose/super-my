      properties:
        metrics: { $ref: '#/components/schemas/AgentMetricsConfig' }
        agent: { $ref: '#/components/schemas/AgentRuntimeConfig' }
        limits: { $ref: '#/components/schemas/AgentLimitsConfig' }
    AgentProbeTarget:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/ProbeTargetTypeRules'
      required:
        - id
        - name
        - type
        - host
        - port
        - path
        - interval_seconds
        - timeout_seconds
        - retention_seconds
        - enabled
        - config_version
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string, enum: [tcp, http, https] }
        host: { type: string, minLength: 1, maxLength: 253 }
        port: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
        path: { type: [string, 'null'], maxLength: 2048, pattern: '^/[^?#]*$', description: HTTP(S) null is normalized to `/`; query and fragment characters are rejected; TCP requires null. }
        interval_seconds: { type: integer, minimum: 10, maximum: 86400 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 60 }
        retention_seconds: { type: integer, minimum: 1, maximum: 7776000 }
        enabled: { type: boolean }
        config_version: { type: integer, minimum: 1, maximum: 9223372036854775807 }
    AgentConfig:
      type: object
      additionalProperties: false
      description: Complete declarative configuration. The serialized response is bounded to 2 MiB; Agent report requests remain bounded to 256 KiB.
      required: [config_version, issued_at, metrics, agent, limits, probe_targets]
      properties:
        config_version: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        issued_at: { type: string, format: date-time }
