          items: { $ref: '#/components/schemas/ProbeSeriesPoint' }
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ready }
