name: Build management candidate and verify immutable legacy release

on:
  push:
    tags:
      - v1.2.0
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release tag to verify
        required: true
        type: choice
        default: v1.1.0
        options:
          - v1.2.0
          - v1.1.0

permissions:
  contents: read

concurrency:
  group: probe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_management:
    name: Build management v1.2.0 candidate
    if: >-
      (github.event_name == 'push' &&
      github.ref == 'refs/tags/v1.2.0') ||
      (github.event_name == 'workflow_dispatch' && inputs.version == 'v1.2.0')
    runs-on: ubuntu-24.04
    container:
      image: debian:13-slim
    permissions:
      contents: read
    env:
      RELEASE_TAG: v1.2.0
    steps:
      - name: Initialize runner-local build paths
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${RUNNER_TEMP:-}" ]]
          [[ "$RUNNER_TEMP" == /* ]]
          {
            printf 'RELEASE_OUTPUT=%s\n' \
              "$RUNNER_TEMP/probe-panel-management-release-v1.2.0"
            printf 'BUILD_SOURCE=%s\n' \
              "$RUNNER_TEMP/probe-panel-management-source-v1.2.0"
            printf 'CANDIDATE_UPLOAD_ROOT=%s\n' \
              "$GITHUB_WORKSPACE/release-upload-v1.2.0"
          } >> "$GITHUB_ENV"

      - name: Install Debian 13 build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl file git gzip python3 tar xz-utils
          rm -rf /var/lib/apt/lists/*

      - name: Install pinned ShellCheck 0.11.0
        shell: bash
        env:
          SHELLCHECK_ARCHIVE_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          extract_root="$RUNNER_TEMP/shellcheck-v0.11.0-root"
          curl --disable --fail --location --show-error --silent \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-all-errors \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$archive"
          [[ "$(stat -c '%s' "$archive")" -eq 2559196 ]]
          printf '%s  %s\n' "$SHELLCHECK_ARCHIVE_SHA256" "$archive" | \
            sha256sum --check --strict
          install -d -m 0700 "$extract_root"
          tar --extract --xz --file "$archive" --directory "$extract_root"
          binary="$extract_root/shellcheck-v0.11.0/shellcheck"
          [[ -f "$binary" && ! -L "$binary" ]]
          install -m 0755 "$binary" /usr/local/bin/shellcheck
          [[ "$(shellcheck --version | awk '$1 == "version:" { print $2 }')" == 0.11.0 ]]

      - name: Check out the exact management tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/v1.2.0

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: probe-api/go.sum

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Require the exact clean remote tag
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == Kcmose/super-my ]]
          [[ "$GITHUB_WORKSPACE" == "$PWD" ]]
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v1.2.0|workflow_dispatch:refs/heads/main)
              ;;
            *)
              printf 'unexpected workflow trigger: %s:%s\n' \
                "$GITHUB_EVENT_NAME" "$GITHUB_REF" >&2
              exit 1
              ;;
          esac
          git remote set-url origin https://github.com/Kcmose/super-my.git
          [[ "$(git remote get-url origin)" == https://github.com/Kcmose/super-my.git ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

          local_tag_object="$(git rev-parse --verify refs/tags/v1.2.0)"
          local_tag_commit="$(git rev-parse --verify 'refs/tags/v1.2.0^{commit}')"
          [[ "$(git rev-parse --verify 'HEAD^{commit}')" == "$local_tag_commit" ]]
          remote_tags="$(git ls-remote --exit-code origin \
            refs/tags/v1.2.0 'refs/tags/v1.2.0^{}')"
          [[ "$(awk '$2 == "refs/tags/v1.2.0" { count++ } END { print count + 0 }' \
            <<<"$remote_tags")" -eq 1 ]]
          [[ "$(awk '$2 == "refs/tags/v1.2.0^{}" { count++ } END { print count + 0 }' \
            <<<"$remote_tags")" -le 1 ]]
          remote_tag_object="$(awk '$2 == "refs/tags/v1.2.0" { print $1 }' \
            <<<"$remote_tags")"
          remote_tag_commit="$(awk '$2 == "refs/tags/v1.2.0^{}" { print $1 }' \
            <<<"$remote_tags")"
          [[ "$remote_tag_object" == "$local_tag_object" ]]
          [[ "${remote_tag_commit:-$remote_tag_object}" == "$local_tag_commit" ]]

      - name: Prepare a root-owned clean source copy
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ! -e "$BUILD_SOURCE" ]]
          [[ -d "$GITHUB_WORKSPACE/.git" && ! -L "$GITHUB_WORKSPACE/.git" ]]
          cp -a --no-preserve=ownership -- "$GITHUB_WORKSPACE" "$BUILD_SOURCE"
          [[ -d "$BUILD_SOURCE/.git" && ! -L "$BUILD_SOURCE/.git" ]]
          [[ -z "$(find "$BUILD_SOURCE" ! -uid "$(id -u)" -print -quit)" ]]
          [[ -z "$(git -C "$BUILD_SOURCE" status --porcelain=v1 --untracked-files=all)" ]]
          [[ "$(git -C "$BUILD_SOURCE" rev-parse --verify 'HEAD^{commit}')" == \
            "$(git -C "$BUILD_SOURCE" rev-parse --verify 'refs/tags/v1.2.0^{commit}')" ]]

      - name: Build management-only release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$BUILD_SOURCE/probe-api/deploy/scripts/build-release-bundles.sh" \
            --profile management \
            --version v1.2.0 \
            --output-dir "$RELEASE_OUTPUT"

      - name: Require exactly the three management assets
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_assets="$(printf '%s\n' \
            SHA256SUMS \
            probe-panel-management-v1.2.0-linux-amd64.tar.gz \
            probe-panel-management-v1.2.0-linux-arm64.tar.gz | LC_ALL=C sort)"
          actual_assets="$(find "$RELEASE_OUTPUT" -mindepth 1 -maxdepth 1 \
            -type f -printf '%f\n' | LC_ALL=C sort)"
          [[ "$actual_assets" == "$expected_assets" ]]
          [[ "$(find "$RELEASE_OUTPUT" -mindepth 1 -maxdepth 1 | wc -l)" -eq 3 ]]
          [[ -z "$(find "$RELEASE_OUTPUT" -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]
          [[ "$(wc -l < "$RELEASE_OUTPUT/SHA256SUMS")" -eq 2 ]]
          full_bundle_prefix="probe-panel-${RELEASE_TAG}-linux-"
          ! grep -Fq "$full_bundle_prefix" "$RELEASE_OUTPUT/SHA256SUMS"
          (
            cd "$RELEASE_OUTPUT"
            sha256sum --check --strict SHA256SUMS
          )

      - name: Bind candidate tarballs to the verified tag commit
        shell: bash
        run: |
          set -Eeuo pipefail
          source_commit="$(git -C "$BUILD_SOURCE" rev-parse --verify \
            'refs/tags/v1.2.0^{commit}')"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          cd "$BUILD_SOURCE/probe-api"
          go run ./cmd/probe-support-gate verify \
            --support-root deploy/support \
            --release v1.2.0 \
            --require-zero-supported \
            --release-assets "$RELEASE_OUTPUT" \
            --source-commit "$source_commit"

      - name: Stage exactly the verified candidate for upload
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_UPLOAD_ROOT" == \
            "$GITHUB_WORKSPACE/release-upload-v1.2.0" ]]
          [[ ! -e "$CANDIDATE_UPLOAD_ROOT" && ! -L "$CANDIDATE_UPLOAD_ROOT" ]]
          install -d -m 0755 "$CANDIDATE_UPLOAD_ROOT"
          for asset in \
            SHA256SUMS \
            probe-panel-management-v1.2.0-linux-amd64.tar.gz \
            probe-panel-management-v1.2.0-linux-arm64.tar.gz; do
            source_asset="$RELEASE_OUTPUT/$asset"
            staged_asset="$CANDIDATE_UPLOAD_ROOT/$asset"
            [[ -f "$source_asset" && ! -L "$source_asset" ]]
            install -m 0644 -- "$source_asset" "$staged_asset"
            cmp -- "$source_asset" "$staged_asset"
          done
          expected_assets="$(printf '%s\n' \
            SHA256SUMS \
            probe-panel-management-v1.2.0-linux-amd64.tar.gz \
            probe-panel-management-v1.2.0-linux-arm64.tar.gz | LC_ALL=C sort)"
          actual_assets="$(find "$CANDIDATE_UPLOAD_ROOT" -mindepth 1 -maxdepth 1 \
            -type f -printf '%f\n' | LC_ALL=C sort)"
          [[ "$actual_assets" == "$expected_assets" ]]
          [[ "$(find "$CANDIDATE_UPLOAD_ROOT" -mindepth 1 -maxdepth 1 | wc -l)" -eq 3 ]]
          [[ -z "$(find "$CANDIDATE_UPLOAD_ROOT" -mindepth 1 -maxdepth 1 \
            ! -type f -print -quit)" ]]
          (
            cd "$CANDIDATE_UPLOAD_ROOT"
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload the unpublished management candidate
        uses: actions/upload-artifact@v4
        with:
          name: probe-panel-management-v1.2.0-candidate
          path: ${{ github.workspace }}/release-upload-v1.2.0/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

  verify_legacy:
    name: Verify published v1.1.0 assets
    if: >-
      (github.event_name == 'release' &&
      github.event.release.tag_name == 'v1.1.0') ||
      (github.event_name == 'workflow_dispatch' && inputs.version == 'v1.1.0')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    steps:
      - name: Require the reviewed immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" == v1.1.0 ]]
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [[ "$(jq -r '.tag_name' <<<"$release_json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r '.draft' <<<"$release_json")" == false ]]
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == false ]]
          [[ "$(jq -r '.immutable' <<<"$release_json")" == true ]]

          expected_assets="$(printf '%s\n' \
            SHA256SUMS \
            probe-panel-v1.1.0-linux-amd64.tar.gz \
            probe-panel-v1.1.0-linux-arm64.tar.gz | LC_ALL=C sort)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort)"
          [[ "$actual_assets" == "$expected_assets" ]]
          jq -e '[.assets[] | select(.size <= 0)] | length == 0' <<<"$release_json" >/dev/null

      - name: Download the published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-assets" \
            --pattern SHA256SUMS \
            --pattern 'probe-panel-v1.1.0-linux-*.tar.gz'

      - name: Verify outer and inner checksums without extracting
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/release-assets"
          [[ "$(wc -l < SHA256SUMS)" -eq 2 ]]
          expected_names="$(printf '%s\n' \
            probe-panel-v1.1.0-linux-amd64.tar.gz \
            probe-panel-v1.1.0-linux-arm64.tar.gz | LC_ALL=C sort)"
          actual_names="$(awk '
            $1 !~ /^[0-9a-f]{64}$/ { exit 2 }
            NF != 2 { exit 3 }
            { print $2 }
          ' SHA256SUMS | LC_ALL=C sort)"
          [[ "$actual_names" == "$expected_names" ]]
          sha256sum --check --strict SHA256SUMS

          python3 - <<'PY'
          import hashlib
          import re
          import tarfile
          from pathlib import Path, PurePosixPath

          release_dir = Path.cwd()
          for architecture in ("amd64", "arm64"):
              root = f"probe-panel-v1.1.0-linux-{architecture}"
              archive = release_dir / f"{root}.tar.gz"
              with tarfile.open(archive, mode="r:gz") as bundle:
                  members = bundle.getmembers()
                  if not members or len(members) > 20000:
                      raise SystemExit(f"{archive.name}: empty or excessive member count")
                  by_name = {}
                  for member in members:
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or not path.parts or ".." in path.parts:
                          raise SystemExit(f"{archive.name}: unsafe path {member.name!r}")
                      if any(part in ("", ".") for part in path.parts):
                          raise SystemExit(f"{archive.name}: non-canonical path {member.name!r}")
                      if path.parts[0] != root:
                          raise SystemExit(f"{archive.name}: unexpected archive root")
                      if member.name in by_name:
                          raise SystemExit(f"{archive.name}: duplicate path {member.name!r}")
                      if member.issym() or member.islnk():
                          raise SystemExit(f"{archive.name}: links are forbidden")
                      if not (member.isfile() or member.isdir()):
                          raise SystemExit(f"{archive.name}: special files are forbidden")
                      if member.isfile() and member.name.endswith(".map"):
                          raise SystemExit(f"{archive.name}: source maps are forbidden")
                      by_name[member.name] = member

                  required = (
                      "RELEASE-MANIFEST",
                      "BUNDLE-SHA256SUMS",
                      "artifacts/api/probe-api",
                      "setup/probe-setup",
                      "artifacts/admin/index.html",
                      "artifacts/web/index.html",
                      "artifacts/agent/downloads/probe-agent/SHA256SUMS",
                      "artifacts/agent/downloads/probe-agent/linux-amd64/probe-agent",
                      "artifacts/agent/downloads/probe-agent/linux-arm64/probe-agent",
                      "source/probe-api/deploy/nginx/nginx-ip.conf",
                      "source/probe-api/deploy/setup/probe-panel-setup.service",
                      "source/probe-api/deploy/setup/probe-panel-setup.socket",
                      "source/probe-api/deploy/setup/probe-panel-finalizer.service",
                      "source/probe-api/deploy/setup/probe-panel-finalizer.path",
                  )
                  for relative in required:
                      member = by_name.get(f"{root}/{relative}")
                      if member is None or not member.isfile():
                          raise SystemExit(f"{archive.name}: missing {relative}")

                  manifest_file = bundle.extractfile(by_name[f"{root}/RELEASE-MANIFEST"])
                  assert manifest_file is not None
                  release_manifest = manifest_file.read().decode("utf-8").splitlines()
                  expected_manifest = [
                      "format=probe-panel-release-v1",
                      "version=v1.1.0",
                      f"architecture=linux-{architecture}",
                      "super_my_ref=refs/tags/v1.1.0",
                      "my_ref=refs/tags/v1.0.0",
                      "my_agent_ref=refs/tags/v1.0.2",
                  ]
                  if release_manifest != expected_manifest:
                      raise SystemExit(f"{archive.name}: RELEASE-MANIFEST mismatch")

                  checksum_file = bundle.extractfile(by_name[f"{root}/BUNDLE-SHA256SUMS"])
                  assert checksum_file is not None
                  checksum_lines = checksum_file.read().decode("utf-8").splitlines()
                  recorded = {}
                  for line in checksum_lines:
                      match = re.fullmatch(r"([0-9a-f]{64})  ([^\s\\]+)", line)
                      if match is None or match.group(2) in recorded:
                          raise SystemExit(f"{archive.name}: malformed BUNDLE-SHA256SUMS")
                      recorded[match.group(2)] = match.group(1)

                  expected_paths = sorted(
                      name[len(root) + 1:]
                      for name, member in by_name.items()
                      if member.isfile()
                      and name.startswith((f"{root}/artifacts/", f"{root}/setup/", f"{root}/source/"))
                  )
                  if sorted(recorded) != expected_paths:
                      raise SystemExit(f"{archive.name}: bundle checksum coverage mismatch")
                  for relative, expected_hash in recorded.items():
                      payload = bundle.extractfile(by_name[f"{root}/{relative}"])
                      assert payload is not None
                      actual_hash = hashlib.sha256(payload.read()).hexdigest()
                      if actual_hash != expected_hash:
                          raise SystemExit(f"{archive.name}: checksum mismatch for {relative}")
          PY
