        enrollment_token: { type: string, minLength: 32, readOnly: true }
        expires_at: { type: string, format: date-time }
        install_command:
          type: string
          minLength: 1
          readOnly: true
          description: One-time GitHub Raw bootstrap command for a user-initiated first installation. It contains the enrollment token as a short argument and must be handled as a secret. Private-preview TLS adds only a pinned public-certificate SHA256; the command never disables TLS verification itself.
    AgentTokenResponse:
      type: object
      additionalProperties: false
      required: [node_id, agent_token, created_at]
      properties:
        node_id: { type: string, format: uuid }
        agent_token: { type: string, minLength: 32, readOnly: true }
        created_at: { type: string, format: date-time }
    AgentEnrollRequest:
      type: object
      additionalProperties: false
      required: [enrollment_token, hostname, agent_version, os, arch]
      properties:
        enrollment_token: { type: string, minLength: 32, maxLength: 1024, writeOnly: true }
        hostname: { type: string, minLength: 1, maxLength: 253 }
        agent_version: { type: string, minLength: 1, maxLength: 64 }
        os: { type: string, const: linux }
        arch: { type: string, enum: [amd64, arm64] }
    AgentEnrollResponse:
      type: object
      additionalProperties: false
      required: [node_id, agent_token, config_version]
      properties:
        node_id: { type: string, format: uuid }
        agent_token: { type: string, minLength: 32, readOnly: true }
        config_version: { type: integer, minimum: 1, maximum: 9223372036854775807 }
    AgentMetricsConfig:
      type: object
      additionalProperties: false
      description: The frozen relation is `5 <= collect_interval_seconds <= report_interval_seconds <= 300`.
      required: [collect_interval_seconds, report_interval_seconds, mountpoints, include_virtual_interfaces]
      properties:
        collect_interval_seconds: { type: integer, minimum: 5, maximum: 300 }
        report_interval_seconds: { type: integer, minimum: 5, maximum: 300 }
        mountpoints:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          contains: { const: / }
          items: { type: string, minLength: 1, maxLength: 4096, pattern: '^/' }
        include_virtual_interfaces: { type: boolean }
    AgentRuntimeConfig:
      type: object
      additionalProperties: false
      description: '`max_memory_queue_seconds` must be greater than or equal to `metrics.report_interval_seconds` in the enclosing configuration.'
      required: [config_refresh_interval_seconds, max_memory_queue_seconds]
      properties:
        config_refresh_interval_seconds: { type: integer, minimum: 10, maximum: 86400 }
        max_memory_queue_seconds: { type: integer, minimum: 1, maximum: 300 }
    AgentLimitsConfig:
